<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App del Clima</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <main class="weather">
    <h1 class="weather__title">Clima</h1>

    <input
      type="text"
      class="weather__input"
      id="cityInput"
      placeholder="Ingresá una ciudad (ej: Madrid)"
    />

    <div id="loader" class="loader hidden"></div>

    <button class="weather__button" id="searchBtn">Buscar</button>

    <p class="weather__geo-link" id="geoBtn">📍 Usar mi ubicación actual</p>

    <section class="weather__result" id="weatherResult">
      <p class="weather__hint">
        Buscá una ciudad para ver el clima actual
      </p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>

</body>
</html>
